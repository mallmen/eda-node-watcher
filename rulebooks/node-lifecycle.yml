---
- name: OpenShift Node Provisioning Lifecycle Manager
  hosts: localhost

  sources:
    - sabre1041.eda.k8s:
        host: "{{ K8S_HOST }}"
        api_key: "{{ K8S_TOKEN }}"
        validate_certs: false
        api_version: "machine.openshift.io/v1beta1"
        kind: "Machine"

  rules:
    - name: Notify
      condition: event.type != ""
      action:
        debug:
          msg: "{{ event }}"                     
