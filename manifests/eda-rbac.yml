# eda-rbac.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: eda-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eda-node-watcher
  namespace: eda-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eda-node-watcher-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eda-node-watcher-binding
subjects:
  - kind: ServiceAccount
    name: eda-node-watcher
    namespace: eda-system
roleRef:
  kind: ClusterRole
  name: eda-node-watcher-role
  apiGroup: rbac.authorization.k8s.io
